# The Halloween show. This file is the playlist: edit it, then press R in the
# console (or restart the director) to load the changes.
#
#   python3 -m haunt check show.yaml       validate it
#   python3 -m haunt demo show.yaml        rehearse it with pretend players
#
# Converted from the playlist that was embedded in playlistManager-mqtt.py.
# See docs/SHOW-FILE.md for every setting.

name: Halloween

mqtt:
  host: 192.168.1.244    # Home Assistant (Mosquitto add-on)
  port: 1883
  username: home-pi
  # The password is NOT kept here (this repo is public). Put it in
  # /etc/haunt/env as HAUNT_MQTT_PASSWORD=..., or point password_file at a file.
  prefix: haunt

players:
  1: {name: Window}     # the Pi that used "--orientation 180"; rotation now lives in its player.yaml
  2: {name: Wall}

lights:
  front_lights: {type: wled, topic: front_lights}
  graveyard: {type: particle, topic: graveyard}
  living_room: {type: hue}     # Philips Hue rooms: `haunt hue` drives the bridge (deploy/hue.example.yaml)
  front_bedroom: {type: hue}   # both switch off whenever the show is not running
  porch: {type: hue}           # accents: the two porch lights ...
  lamp_post: {type: hue}       # ... and the driveway lamp post
  floods: {type: floods}       # the 15 AiDot solar floods, 1 = Window end .. 15 = Wall end: `haunt floods` drives them through Home Assistant (deploy/floods.example.yaml)

# Things the show switches on and off. The director publishes ON/OFF to
# haunt/output/<name>/set (retained); something else does the switching.
# In a scene:  on = on for the scene, a number = a burst of that many seconds.
outputs:
  pond_mister: {label: mister}           # Tapo plug in Home Assistant: deploy/home-assistant/haunt-outputs.yaml
  fog_machine: {label: fog, max_on: 10}  # DMX F-3000 via USB-DMX dongle: haunt dmx (deploy/dmx.example.yaml); never on longer than 10 s

defaults:
  fade_in: 1.0        # seconds; picture and sound fade up from black
  fade_out: 1.5       # seconds; at the natural end of a clip
  skip_fade: 0.6      # seconds; when you press next / prev / stop
  gap: 0.5            # seconds of black between scenes
  target_lufs: -14    # every clip is normalised to this loudness (a limiter catches the peaks)

# front_lights effects are WLED effect/palette names from
# https://kno.wled.ge/features/effects (or their numbers); see docs/SHOW-FILE.md.
#
# In each scene the MASTER's clip decides how long the scene lasts. The other
# player is a follower: it can start late (start_after = position of the
# master, in seconds) and is faded out when the master finishes.
#
# level is "how loud should this be", 0-150, AFTER loudness normalisation, so
# 100 means the same loudness for every clip. The numbers below are a first
# guess from the old omxplayer vol values (kept in the comments); tune them by
# ear from the console with [ and ], and they are remembered.

scenes:
  - name: Pumpkin Song
    master: 1
    end_at: 100
    players:
      1:
        file: "Jack-O-Lantern - Songs - Window/Jack-O-Lantern - Songs - Window/JOLJ_PumpkinSong_Trio_Win_BG_H.mp4"
        level: 100  # old omxplayer vol: 5
      2:
        file: "Bone Chillers - Numskulls/Wall/BC_Numskulls_Wall_H.mp4"
        level: 60   # old omxplayer vol: -7
        loop: true
        start_after: 15
    lights:
      front_lights: {effect: Candle Multi, colors: ["#ff6a00"], speed: 96, intensity: 200, transition: 1}      # candle-lit jack-o-lanterns
      floods: {color: "#ff6a00", animation: flicker, period: 2.5, low: 0.45, bri: 230}          # a row of jack-o-lanterns
      graveyard: "#007200"
      living_room: {color: "#ff6a00", effect: candle, bri: 220}                                    # candle-lit, like the jack-o-lanterns
      front_bedroom: {color: "#ff5000", effect: candle, bri: 160}
      porch: {color: "#ff6a00", bri: 180}                                          # accent: pumpkin orange
      lamp_post: {color: "#ff7a00", animation: flicker, period: 1.2, low: 0.6}          # an old gas lamp

  - name: Wicked Brew
    master: 2
    players:
      1:
        file: "Jack-O-Lantern - Funny Faces - Window/Jack-O-Lantern - Funny Faces - Window/JOLJ_FunnyFaces_Trio_Win_BG_H.mp4"
        level: 60   # old omxplayer vol: -18
        loop: true
        start_after: 8
      2:
        file: "WH - Spell2 - Wicked Brew - Hollusion+TV+Window/WH_Spell 2_WickedBrew_Holl_H.mp4"
        level: 100  # old omxplayer vol: 10
    lights:
      front_lights: {effect: Popcorn, colors: ["#00ff40", "#3a0066"], speed: 80, intensity: 100, transition: 1}   # bubbling cauldron
      floods: {colors: ["#00ff40", "#3a0066"], animation: sparkle, period: 3, low: 0.35, flash: "#a0ff60"}   # bubbles popping
      graveyard: "#310059"
      living_room: {colors: ["#20ff40", "#5a00a0"], animation: pulse, period: 4, low: 0.25}          # the cauldron glowing and fading
      front_bedroom: {colors: ["#5a00a0", "#20ff40"], animation: drift, period: 5}
      porch: {color: "#20ff40", bri: 170}
      lamp_post: {color: "#7a00ff", animation: flicker, period: 1.2, low: 0.5}
    outputs: {pond_mister: on}

  - name: Twas the Night
    master: 1
    players:
      1:
        file: "Jack-O-Lantern - Stories - Window/Jack-O-Lantern - Stories - Window/JOLJ_TwasTheNight_Trio_Win_BG_H.mp4"
        level: 100  # old omxplayer vol: 0
      2:
        file: "Bone Chillers - Jittery Bones/Wall/BC_JitteryBones_Wall_H.mp4"
        level: 75   # old omxplayer vol: -7
        start_after: 20
    lights:
      front_lights: {effect: Halloween Eyes, colors: ["#ff2000", "#000000"], speed: 128, intensity: 128, transition: 1}   # eyes blinking in the dark under the story
      floods: {color: "#2a0050", animation: sparkle, flash: "#ff2000", period: 5, low: 0.5, bri: 160}   # red eyes opening in the dark
      graveyard: "#ffa500"
      living_room: {color: "#ff5000", effect: candle, bri: 110}                                    # low firelight for the story
      front_bedroom: {color: "#600000", animation: pulse, period: 6, low: 0.2, bri: 160}            # something red breathing upstairs
      porch: {color: "#ff2000", bri: 150}                                          # red eyes in the dark
      lamp_post: {color: "#ff8a30", animation: flicker, period: 1.4, low: 0.5}

  - name: Dragula APT
    master: 1
    players:
      1:
        file: "DJ-Cummerbund-DragulAPT.mp4"
        level: 100  # old omxplayer vol: 10
      2:
        file: "EE_OminousOculi_Swarm_Eyes+Mouths_H.mp4"
        level: 50   # eyes loop at 50% in every scene (was 0; old omxplayer vol -99)
    lights:
      front_lights: {effect: Fire 2012, palette: Fire, speed: 120, intensity: 160, transition: 1}   # "burn through the witches"
      floods: {colors: ["#ff2000", "#ff8000"], animation: flicker, period: 1.5, low: 0.3}         # the house on fire
      graveyard: "#c8c800"
      living_room: {colors: ["#ff3000", "#ff8000"], effect: fire}                                  # burn through the witches
      front_bedroom: {colors: ["#ff2000", "#ff7000"], effect: fire, bri: 200}
      porch: {color: "#ff3000", effect: fire}
      lamp_post: {color: "#ff4000", animation: flicker, period: 0.6, low: 0.4}

  - name: Cat Crow Canzonet
    master: 2
    players:
      1:
        file: "TnT - Vampire Scenes - Window/TnT_BatsAndBrooms_Win_H.mp4"
        level: 60   # old omxplayer vol: -7
        start_after: 20
      2:
        file: "WH - Song2 - Cat Crow Canzonet - Hollusion-TV-Window/WH_Song 2_CatCrow_Holl_H.mp4"
        level: 100  # old omxplayer vol: 10
    lights:
      front_lights: {effect: Dancing Shadows, palette: Set Colors, colors: ["#7a00ff", "#00ff60"], speed: 90, intensity: 128, transition: 1}   # cat and crow flitting
      floods: {colors: ["#7a00ff", "#00ff60"], animation: drift, period: 1.5}                   # purple/green crawling along
      graveyard: "#310059"
      living_room: {colors: ["#7a00ff", "#00ff60"], animation: drift, period: 3}                   # cat and crow chasing round the room
      front_bedroom: {colors: ["#00ff60", "#7a00ff"], animation: drift, period: 3}
      porch: {colors: ["#7a00ff", "#00ff60"], animation: drift, period: 6}
      lamp_post: {color: "#00ff60", bri: 160}
    outputs: {pond_mister: on}

  - name: Frankenstein
    master: 1
    players:
      1:
        file: "Tricks and Treats-Frankenstein.mp4"
        level: 100  # old omxplayer vol: 10
        start: 37
      2:
        file: "Phantasms-Rise Of The Wraiths.mp4"
        level: 100  # old omxplayer vol: 10
        start_after: 40
    lights:
      front_lights: {effect: Lightning, colors: ["#c8d8ff", "#001a08"], speed: 150, intensity: 150, transition: 1}   # the lab coming alive
      floods: {color: "#003010", animation: lightning, period: 4, low: 0.3}                     # storm over the lab
      graveyard: "#004000"
      living_room: {color: "#0a1a40", animation: lightning, period: 7, low: 0.3}                  # the lab in a storm
      front_bedroom: {color: "#0a2a10", animation: lightning, period: 9, low: 0.3}                  # its own strikes, out of step
      porch: {color: "#0a2a10", animation: lightning, period: 11, low: 0.4}         # strikes of its own
      lamp_post: {color: "#c8d8ff", animation: flicker, period: 0.5, low: 0.2}          # sputtering in the storm
    outputs: {fog_machine: 6}

  - name: Thriller
    master: 1
    players:
      1:
        file: "Thriller/thriller_video.mp4"
        level: 100  # old omxplayer vol: 15
        start: 244
      2:
        file: "Thriller/thriller_anim.mp4"
        level: 0    # old omxplayer vol: -100 (--vol -4000)
        start_after: 420
        end_at: 225
    lights:
      front_lights: {effect: Colorwaves, palette: Magred, speed: 70, intensity: 128, transition: 1}   # red/magenta dance floor
      floods: {colors: ["#ff0040", "#a000ff"], animation: chase, direction: bounce, width: 2, period: 6, low: 0.15}   # dance-floor sweep
      graveyard: "#400040"
      living_room: {colors: ["#ff0020", "#c00080"], animation: drift, period: 5}                   # red/magenta dance floor
      front_bedroom: {color: "#a00060", animation: pulse, period: 4, low: 0.2}
      porch: {color: "#ff0020", bri: 180}
      lamp_post: {color: "#c00080", animation: pulse, period: 4, low: 0.3}
    outputs: {fog_machine: 8}
    cues:
      - {at: 420, outputs: {fog_machine: 6},   # the zombies rise (the animation starts at 420 s)
         lights: {living_room: {colors: ["#40ff20", "#106000"], animation: flicker, period: 0.7, low: 0.3},
                  front_bedroom: {color: "#40ff20", animation: flicker, period: 0.9, low: 0.3},
                  porch: {color: "#40ff20", bri: 200},
                  lamp_post: {color: "#40ff20", animation: flicker, period: 0.7, low: 0.3}}}

  - name: Witching Hour
    master: 2
    players:
      1:
        file: "BOO_BooTime_Holl_H.mp4"
        level: 60   # old omxplayer vol: -15
        loop: true
      2:
        file: "WH - Song1 - Witching Hour - Hollusion-TV-Window/WH_Song 1_WitchingHour_Holl_H.mp4"
        level: 100  # old omxplayer vol: 0
    lights:
      front_lights: {effect: Fairytwinkle, colors: ["#9d00ff", "#20ff40"], speed: 100, intensity: 128, transition: 1}   # witch sparkle
      floods: {colors: ["#9d00ff", "#20ff40"], pattern: blocks, animation: pulse, period: 4, low: 0.15}   # witchy swell, Window half and Wall half
      graveyard: "#c80000"
      living_room: {colors: ["#9d00ff", "#20ff40"], effect: sparkle}                               # witch sparkle (drift where a bulb has no sparkle)
      front_bedroom: {colors: ["#20ff40", "#9d00ff"], animation: drift, period: 4}
      porch: {color: "#9d00ff", bri: 200}
      lamp_post: {color: "#20ff40", animation: flicker, period: 1.0, low: 0.5}
    outputs: {pond_mister: on}

  - name: In the Hall
    master: 1
    players:
      1:
        file: "Jack-O-Lantern - Songs - Window/Jack-O-Lantern - Songs - Window/JOLJ_InTheHallSong_Trio_Win_BG_H.mp4"
        level: 100  # old omxplayer vol: 10
      2:
        file: "EE_OminousOculi_Swarm_Eyes+Mouths_H.mp4"
        level: 50   # eyes loop at 50% in every scene (was 60; old omxplayer vol 0)
        loop: true
    lights:
      front_lights: {effect: Running, colors: ["#ff6a00", "#000000"], speed: 140, intensity: 80, transition: 1}   # Mountain King march
      floods: {color: "#ff6a00", animation: chase, width: 1, period: 3, low: 0.05}             # the march
      graveyard: "#ffa500"
      living_room: {colors: ["#ff6a00", "#ff2000"], animation: pulse, period: 2.5, low: 0.1}      # the march
      front_bedroom: {colors: ["#ff2000", "#ff6a00"], animation: pulse, period: 2.5, low: 0.1}
      porch: {color: "#ff6a00", animation: pulse, period: 2.5, low: 0.3}           # marching with the rooms
      lamp_post: {color: "#ff6a00", bri: 200}

  - name: Ghostbusters
    master: 2
    players:
      1:
        file: "EE_OminousOculi_Swarm_Eyes+Mouths_H.mp4"
        level: 50   # eyes loop at 50% in every scene (was 0; old omxplayer vol -75)
        loop: true
      2:
        file: "Ghostbusters_LilJon-clean.mp4"
        level: 100  # old omxplayer vol: -50
    lights:
      front_lights: {effect: Meteor, o3: true, colors: ["#20ff20"], speed: 150, intensity: 128, transition: 1}   # green slimers zipping by (o3 = WLED 16's "Smooth" option)
      floods: {color: "#20ff20", animation: chase, width: 1, period: 2, low: 0.05}             # slimer zipping across the house
      graveyard: "#c8c800"
      living_room: {colors: ["#20ff20", "#a0ff00", "#00c060"], animation: drift, period: 2}        # slime
      front_bedroom: {color: "#30ff30", animation: flicker, period: 0.8, low: 0.4, bri: 200}        # a slimer in the bedroom
      porch: {color: "#20ff20", bri: 200}
      lamp_post: {color: "#30ff30", animation: flicker, period: 0.8, low: 0.4}

  - name: Spooky Scary Skeletons
    master: 1
    players:
      1:
        file: "Spooly Scarry Skel.mp4"
        level: 100  # old omxplayer vol: 30
      2:
        file: "Bone Chillers-Dancing Dead.mp4"
        level: 0    # old omxplayer vol: -100 (--vol -4000)
        loop: true
    lights:
      front_lights: {effect: Bouncing Balls, colors: ["#ffffff", "#200040"], speed: 128, intensity: 100, transition: 1}   # dancing bones
      floods: {colors: ["#ffffff", "#200040"], animation: drift, period: 1}                    # bones jiggling
      graveyard: "#400000"
      living_room: {colors: ["#ffffff", "#5000a0"], animation: drift, period: 1.5}                 # bone white and purple, bouncing
      front_bedroom: {color: "#e0e0ff", animation: pulse, period: 2, low: 0.1}
      porch: {colors: ["#ffffff", "#5000a0"], animation: drift, period: 3}
      lamp_post: {color: "#e0e0ff", bri: 200}

  - name: Seance
    master: 2
    players:
      1:
        file: "Ghostly Apparitions-Beckoning Beauty.mp4"
        level: 60   # old omxplayer vol: -15
        loop: true
      2:
        file: "WH - Spell3 - Seance - Hollusion-TV-Window/WH_Spell 3_Seance_Holl_H.mp4"
        level: 100  # old omxplayer vol: 0
    lights:
      front_lights: {effect: Aurora, palette: Set Colors, colors: ["#6a00ff", "#00c8a0"], speed: 60, intensity: 150, transition: 1}   # spirit glow
      floods: {colors: ["#6a00ff", "#00c8a0"], animation: pulse, period: 5, low: 0.2}   # spirits breathing
      graveyard: "#00c800"
      living_room: {colors: ["#6a00ff", "#00c8a0"], animation: drift, period: 6, bri: 180}         # spirit glow
      front_bedroom: {color: "#ff7a20", effect: candle, bri: 120}                                   # seance candles
      porch: {color: "#00c8a0", bri: 150}
      lamp_post: {color: "#ff7a20", effect: candle}
    outputs: {pond_mister: on, fog_machine: 5}

  - name: Guardians Inferno
    master: 1
    players:
      1:
        file: "Guardians_inferno.mp4"
        level: 100  # old omxplayer vol: 0
      2:
        file: "EE_OminousOculi_Swarm_Eyes+Mouths_H.mp4"
        level: 50   # eyes loop at 50% in every scene (was 100; old omxplayer vol 0)
        loop: true
    lights:
      front_lights: {effect: Bpm, palette: Party, speed: 128, intensity: 128, transition: 1}   # disco
      floods: {colors: ["#ff0000", "#ffaa00", "#00ff00", "#0060ff", "#c000ff"], animation: drift, period: 1}   # disco
      graveyard: "#c8c800"
      living_room: {colors: ["#ff0040", "#ffaa00", "#00ff80", "#0060ff", "#c000ff"], animation: drift, period: 1}   # disco
      front_bedroom: {colors: ["#c000ff", "#0060ff", "#00ff80", "#ffaa00", "#ff0040"], animation: drift, period: 1.2}
      porch: {colors: ["#ff0040", "#ffaa00", "#00ff80", "#0060ff", "#c000ff"], animation: drift, period: 2}
      lamp_post: {colors: ["#c000ff", "#0060ff", "#00ff80", "#ffaa00", "#ff0040"], animation: drift, period: 1.5}

  - name: Ghosts n Stuff
    master: 2
    players:
      1:
        file: "Jack-O-Lantern - Funny Faces - Window/Jack-O-Lantern - Funny Faces - Window/JOLJ_FunnyFaces_Trio_Win_BG_H.mp4"
        level: 100  # old omxplayer vol: 0
        loop: true
      2:
        file: "deadmou5_ghostsnstuff.mp4"
        level: 100  # old omxplayer vol: 0
    lights:
      front_lights: {effect: Juggle, speed: 160, intensity: 128, transition: 1}   # EDM
      floods: {colors: ["#00ffff", "#ff00ff"], pattern: blocks, animation: pulse, period: 2, low: 0.1}   # Window half vs Wall half, swapping each beat
      graveyard: "#c80000"
      living_room: {colors: ["#00a0ff", "#ff00c0"], animation: pulse, period: 2, low: 0.1}        # EDM
      front_bedroom: {colors: ["#00ffff", "#ff00ff", "#0000ff"], animation: drift, period: 1}
      porch: {colors: ["#00a0ff", "#ff00c0"], animation: pulse, period: 2, low: 0.3}
      lamp_post: {colors: ["#00ffff", "#ff00ff"], animation: drift, period: 2}


  - name: Stayin' Undead
    master: 1
    players:
      1:
        file: "Stayin-Undead-fast-cut-v2.mp4"
        level: 100
      2:
        file: "Stayin-Undead-scrim-loop-78s.mp4"
        level: 0    # muted; the window carries the song
        loop: true
        start_after: 5
    lights:
      front_lights: {effect: Glitter, palette: Party, speed: 128, intensity: 128, transition: 1}   # disco-ball sparkle
      floods: {colors: ["#ff00ff", "#00ffff", "#ffff00"], animation: sparkle, flash: "#ffffff", period: 2, low: 0.4}   # mirror ball
      graveyard: "#00c800"
      living_room: {colors: ["#ff0040", "#ffaa00", "#00ff80", "#0060ff", "#c000ff"], effect: prism}   # disco ball (drift where a bulb has no prism)
      front_bedroom: {colors: ["#ffaa00", "#ff0040", "#c000ff", "#0060ff", "#00ff80"], animation: drift, period: 1.5}
      porch: {colors: ["#ff0040", "#ffaa00", "#00ff80", "#0060ff", "#c000ff"], animation: drift, period: 2}
      lamp_post: {colors: ["#0060ff", "#c000ff", "#ff0040", "#ffaa00", "#00ff80"], effect: prism}
