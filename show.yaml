# The Halloween show. This file is the playlist: edit it, then press R in the
# console (or restart the director) to load the changes.
#
#   python3 -m haunt check show.yaml       validate it
#   python3 -m haunt demo show.yaml        rehearse it with pretend players
#
# Converted from the playlist that was embedded in playlistManager-mqtt.py.
# See docs/SHOW-FILE.md for every setting.

name: Halloween
cues_file: show-cues.yaml   # lighting timelines generated from the videos (tools/make_cues.py)

mqtt:
  host: 192.168.1.244    # Home Assistant (Mosquitto add-on)
  port: 1883
  username: home-pi
  # The password is NOT kept here (this repo is public). Put it in
  # /etc/haunt/env as HAUNT_MQTT_PASSWORD=..., or point password_file at a file.
  prefix: haunt

players:
  1: {name: Window}     # the Pi that used "--orientation 180"; rotation now lives in its player.yaml
  2: {name: Wall}

lights:
  front_lights: {type: wled, topic: front_lights}
  graveyard: {type: particle, topic: graveyard}
  living_room: {type: hue}     # Philips Hue rooms: `haunt hue` drives the bridge (deploy/hue.example.yaml)
  front_bedroom: {type: hue}   # both switch off whenever the show is not running
  porch: {type: hue}           # accents: the two porch lights ...
  lamp_post: {type: hue}       # ... and the driveway lamp post
  floods: {type: floods}       # the 14 AiDot solar floods, Window end .. Wall end: `haunt floods` drives them through Home Assistant (deploy/floods.example.yaml)

# Things the show switches on and off. The director publishes ON/OFF to
# haunt/output/<name>/set (retained); something else does the switching.
# In a scene:  on = on for the scene, a number = a burst of that many seconds.
outputs:
  pond_mister: {label: mister}           # Tapo plug in Home Assistant: deploy/home-assistant/haunt-outputs.yaml
  fog_machine: {label: fog, max_on: 10}  # DMX F-3000 via USB-DMX dongle: haunt dmx (deploy/dmx.example.yaml); never on longer than 10 s

defaults:
  fade_in: 1.0        # seconds; picture and sound fade up from black
  fade_out: 1.5       # seconds; at the natural end of a clip
  skip_fade: 0.6      # seconds; when you press next / prev / stop
  gap: 0.5            # seconds of black between scenes
  target_lufs: -14    # every clip is normalised to this loudness (a limiter catches the peaks)

# front_lights effects are WLED effect/palette names from
# https://kno.wled.ge/features/effects (or their numbers); see docs/SHOW-FILE.md.
#
# In each scene the MASTER's clip decides how long the scene lasts. The other
# player is a follower: it can start late (start_after = position of the
# master, in seconds) and is faded out when the master finishes.
#
# level is "how loud should this be", 0-150, AFTER loudness normalisation, so
# 100 means the same loudness for every clip. The numbers below are a first
# guess from the old omxplayer vol values (kept in the comments); tune them by
# ear from the console with [ and ], and they are remembered.

scenes:
  - name: Pumpkin Song
    master: 1
    end_at: 100
    players:
      1:
        file: "Jack-O-Lantern - Songs - Window/Jack-O-Lantern - Songs - Window/JOLJ_PumpkinSong_Trio_Win_BG_H.mp4"
        level: 100  # old omxplayer vol: 5
      2:
        file: "Bone Chillers - Numskulls/Wall/BC_Numskulls_Wall_H.mp4"
        level: 60   # old omxplayer vol: -7
        loop: true
        start_after: 15
    lights:
      front_lights: {effect: Candle Multi, colors: ["#ff6a00"], speed: 96, intensity: 200, transition: 1}      # candle-lit jack-o-lanterns
      floods: {color: "#ff6a00"}   # a row of lit pumpkins, steady
      graveyard: "#00ff00"
      living_room: {color: "#ff6a00", effect: candle}   # candle-lit, full power
      front_bedroom: {color: "#ff5000", effect: candle}
      porch: {color: "#ff6a00"}   # accent: pumpkin orange
      lamp_post: {color: "#ff7a00", animation: flicker, period: 1.2, low: 0.7}   # an old gas lamp
    outputs: {fog_machine: {burst: 3, every: 40, first: 5}}   # fog: a light haze for the opener

  - name: Wicked Brew
    master: 2
    players:
      1:
        file: "Jack-O-Lantern - Funny Faces - Window/Jack-O-Lantern - Funny Faces - Window/JOLJ_FunnyFaces_Trio_Win_BG_H.mp4"
        level: 60   # old omxplayer vol: -18
        loop: true
        start_after: 8
      2:
        file: "WH - Spell2 - Wicked Brew - Hollusion+TV+Window/WH_Spell 2_WickedBrew_Holl_H.mp4"
        level: 100  # old omxplayer vol: 10
    lights:
      front_lights: {effect: Popcorn, colors: ["#00ff40", "#6000c0"], speed: 80, intensity: 180, transition: 1}   # bubbles popping over a lit purple brew (measured 73%)
      floods: {colors: ["#00ff40", "#7a00ff"], animation: drift, period: 10}   # potion green and purple, slowly changing places
      graveyard: "#8c00ff"
      living_room: {colors: ["#20ff40", "#5a00a0"], animation: pulse, period: 4, low: 0.6}   # the cauldron glowing and fading
      front_bedroom: {colors: ["#5a00a0", "#20ff40"], animation: drift, period: 5}
      porch: {color: "#20ff40"}
      lamp_post: {color: "#7a00ff", animation: flicker, period: 1.2, low: 0.7}
    outputs: {pond_mister: on, fog_machine: {burst: 3, every: 35, first: 3}}   # fog: the cauldron steaming, with the mister

  - name: Twas the Night
    master: 1
    players:
      1:
        file: "Jack-O-Lantern - Stories - Window/Jack-O-Lantern - Stories - Window/JOLJ_TwasTheNight_Trio_Win_BG_H.mp4"
        level: 100  # old omxplayer vol: 0
      2:
        file: "Bone Chillers - Jittery Bones/Wall/BC_JitteryBones_Wall_H.mp4"
        level: 75   # old omxplayer vol: -7
        start_after: 20
    lights:
      front_lights: {effect: Halloween Eyes, colors: ["#ffff40", "#c03000"], speed: 128, intensity: 200, transition: 1}   # eyes blinking over an orange glow (measured 73%; on black it was dark)
      floods: {color: "#ff3000"}   # story-time glow, steady
      graveyard: "#ffa500"
      living_room: {color: "#ff5000", effect: candle}   # low firelight for the story
      front_bedroom: {color: "#ff2000", animation: pulse, period: 6, low: 0.6}   # something red breathing upstairs
      porch: {color: "#ff2000"}   # red eyes in the dark
      lamp_post: {color: "#ff8a30", animation: flicker, period: 1.4, low: 0.7}
    outputs: {fog_machine: {burst: 3, every: 30, first: 5}}   # fog: night mist while the story is told

  - name: Dragula APT
    master: 1
    players:
      1:
        file: "DJ-Cummerbund-DragulAPT.mp4"
        level: 100  # old omxplayer vol: 10
      2:
        file: "EE_OminousOculi_Swarm_Eyes+Mouths_H.mp4"
        level: 50   # eyes loop at 50% in every scene (was 0; old omxplayer vol -99)
    lights:
      front_lights: {effect: Fire 2012, palette: Fire, speed: 30, intensity: 180, grouping: 5, mirror: true, transition: 1}   # "burn through the witches": flames up from both corners, meeting in the middle
      floods: {colors: ["#ff2000", "#ff8000"], animation: drift, period: 8}   # fire colours rolling along the house
      graveyard: "#ffff00"
      living_room: {colors: ["#ff3000", "#ff8000"], effect: fire}                                  # burn through the witches
      front_bedroom: {colors: ["#ff2000", "#ff7000"], effect: fire}
      porch: {color: "#ff3000", effect: fire}
      lamp_post: {color: "#ff4000", animation: flicker, period: 0.8, low: 0.6}
    outputs: {fog_machine: {burst: 4, every: 35, first: 2}}   # fog: smoke from the fire

  - name: Cat Crow Canzonet
    master: 2
    players:
      1:
        file: "TnT - Vampire Scenes - Window/TnT_BatsAndBrooms_Win_H.mp4"
        level: 60   # old omxplayer vol: -7
        start_after: 20
      2:
        file: "WH - Song2 - Cat Crow Canzonet - Hollusion-TV-Window/WH_Song 2_CatCrow_Holl_H.mp4"
        level: 100  # old omxplayer vol: 10
    lights:
      front_lights: {effect: Colorwaves, palette: Color Gradient, colors: ["#7a00ff", "#00ff60", "#7a00ff"], speed: 90, intensity: 128, transition: 1}   # purple and green waves (measured 51%; Dancing Shadows was 3%)
      floods: {colors: ["#7a00ff", "#00ff60"], animation: drift, period: 10}   # purple/green crawling along
      graveyard: "#8c00ff"
      living_room: {colors: ["#7a00ff", "#00ff60"], animation: drift, period: 3}                   # cat and crow chasing round the room
      front_bedroom: {colors: ["#00ff60", "#7a00ff"], animation: drift, period: 3}
      porch: {colors: ["#7a00ff", "#00ff60"], animation: drift, period: 6}
      lamp_post: {color: "#00ff60"}
    outputs: {pond_mister: on, fog_machine: {burst: 3, every: 30, first: 3}}   # fog: short: the witch is on the wall, keep her visible

  - name: Frankenstein
    master: 1
    players:
      1:
        file: "Tricks and Treats-Frankenstein.mp4"
        level: 100  # old omxplayer vol: 10
        start: 37
      2:
        file: "Phantasms-Rise Of The Wraiths.mp4"
        level: 50   # Karl 2026-10-31: wall at half volume
        start_after: 40
    lights:
      front_lights: {effect: Lightning, colors: ["#e0e8ff", "#1838a0"], speed: 150, intensity: 150, transition: 1}   # strikes over a stormy blue sky (measured 61%; over black it was 10%)
      floods: {color: "#2050ff", animation: lightning, period: 8, low: 0.6, flash: "#ffffff"}   # storm blue with lightning, lit between strikes
      graveyard: "#00ff00"
      living_room: {color: "#2050ff", animation: lightning, period: 7, low: 0.6}   # the lab in a storm, lit between strikes
      front_bedroom: {color: "#20ff60", animation: lightning, period: 9, low: 0.6}   # its own strikes, out of step
      porch: {color: "#20ff60", animation: lightning, period: 11, low: 0.6}   # strikes of its own
      lamp_post: {color: "#c8d8ff", animation: flicker, period: 0.6, low: 0.6}   # sputtering in the storm
    outputs: {fog_machine: {burst: 6, every: 25}}   # fog: the lab storm: a big burst at the start, then more

  - name: Thriller
    master: 1
    players:
      1:
        file: "Thriller/thriller_video.mp4"
        level: 100  # old omxplayer vol: 15
        start: 244
      2:
        file: "Thriller/thriller_anim.mp4"
        level: 0    # old omxplayer vol: -100 (--vol -4000)
        start_after: 420
        end_at: 225
    lights:
      front_lights: {effect: Colorwaves, palette: Color Gradient, colors: ["#ff0020", "#c000ff", "#ff0080"], speed: 70, intensity: 128, transition: 1}   # red/magenta waves (measured 60%; the Magred palette was half black)
      floods: {colors: ["#ff0040", "#a000ff"], animation: drift, period: 10}   # red and magenta, slowly changing places
      graveyard: "#ff00ff"
      living_room: {colors: ["#ff0020", "#c00080"], animation: drift, period: 5}                   # red/magenta dance floor
      front_bedroom: {color: "#a00060", animation: pulse, period: 4, low: 0.6}
      porch: {color: "#ff0020"}
      lamp_post: {color: "#c00080", animation: pulse, period: 4, low: 0.6}
    outputs: {pond_mister: on, fog_machine: {burst: 6, every: 45}}   # mister the whole song (Karl 2026-10-31); fog: graveyard fog all the way through (plus the 7:00 cue)
    cues:
      - {at: 420, outputs: {fog_machine: 6},   # the zombies rise (the animation starts at 420 s)
         lights: {living_room: {colors: ["#40ff20", "#20c000"], animation: flicker, period: 0.9, low: 0.6},
                  front_bedroom: {color: "#40ff20", animation: flicker, period: 1.1, low: 0.6},
                  porch: {color: "#40ff20"},
                  lamp_post: {color: "#40ff20", animation: flicker, period: 0.9, low: 0.6}}}

  - name: Witching Hour
    master: 2
    players:
      1:
        file: "BOO_BooTime_Holl_H.mp4"
        level: 60   # old omxplayer vol: -15
        loop: true
      2:
        file: "WH - Song1 - Witching Hour - Hollusion-TV-Window/WH_Song 1_WitchingHour_Holl_H.mp4"
        level: 100  # old omxplayer vol: 0
    lights:
      front_lights: {effect: Fairytwinkle, colors: ["#9d00ff", "#20ff40"], speed: 100, intensity: 128, transition: 1}   # witch sparkle
      floods: {colors: ["#9d00ff", "#20ff40"], animation: drift, period: 10}   # witchy swell, Window half and Wall half
      graveyard: "#ff0000"
      living_room: {colors: ["#9d00ff", "#20ff40"], effect: sparkle}                               # witch sparkle (drift where a bulb has no sparkle)
      front_bedroom: {colors: ["#20ff40", "#9d00ff"], animation: drift, period: 4}
      porch: {color: "#9d00ff"}
      lamp_post: {color: "#20ff40", animation: flicker, period: 1.0, low: 0.7}
    outputs: {pond_mister: on, fog_machine: {burst: 3, every: 35, first: 3}}   # fog: short: the witch is on the wall, keep her visible

  - name: In the Hall
    master: 1
    players:
      1:
        file: "Jack-O-Lantern - Songs - Window/Jack-O-Lantern - Songs - Window/JOLJ_InTheHallSong_Trio_Win_BG_H.mp4"
        level: 100  # old omxplayer vol: 10
      2:
        file: "EE_OminousOculi_Swarm_Eyes+Mouths_H.mp4"
        level: 50   # eyes loop at 50% in every scene (was 60; old omxplayer vol 0)
        loop: true
    lights:
      front_lights: {effect: Running, colors: ["#ff8000", "#ff1000"], speed: 140, intensity: 80, transition: 1}   # marching waves, orange over red (measured 97%)
      floods: {colors: ["#ff6a00", "#ff2000"], animation: drift, period: 6}   # orange and red marching along
      graveyard: "#ffa500"
      living_room: {colors: ["#ff6a00", "#ff2000"], animation: pulse, period: 2.5, low: 0.6}   # the march
      front_bedroom: {colors: ["#ff2000", "#ff6a00"], animation: pulse, period: 2.5, low: 0.6}
      porch: {color: "#ff6a00", animation: pulse, period: 2.5, low: 0.6}   # marching with the rooms
      lamp_post: {color: "#ff6a00"}
    outputs: {fog_machine: {burst: 3, every: 30, first: 10}}   # fog: the march into the mountain

  - name: Ghostbusters
    master: 2
    players:
      1:
        file: "EE_OminousOculi_Swarm_Eyes+Mouths_H.mp4"
        level: 50   # eyes loop at 50% in every scene (was 0; old omxplayer vol -75)
        loop: true
      2:
        file: "Ghostbusters_LilJon-clean.mp4"
        level: 100  # old omxplayer vol: -50
    lights:
      front_lights: {effect: Meteor, o3: true, colors: ["#20ff20"], speed: 150, intensity: 128, transition: 1}   # green slimers zipping by (o3 = WLED 16's "Smooth" option)
      floods: {colors: ["#20ff20", "#a0ff00"], animation: drift, period: 10}   # slime green
      graveyard: "#ffff00"
      living_room: {colors: ["#20ff20", "#a0ff00", "#00c060"], animation: drift, period: 2}        # slime
      front_bedroom: {color: "#30ff30", animation: flicker, period: 1.2, low: 0.6}   # a slimer in the bedroom
      porch: {color: "#20ff20"}
      lamp_post: {color: "#30ff30", animation: flicker, period: 1.2, low: 0.6}
    outputs: {fog_machine: {burst: 4, every: 35, first: 5}}   # fog: slime haze

  - name: Spooky Scary Skeletons
    master: 1
    players:
      1:
        file: "Spooly Scarry Skel.mp4"
        level: 100  # old omxplayer vol: 30
      2:
        file: "Bone Chillers-Dancing Dead.mp4"
        level: 0    # old omxplayer vol: -100 (--vol -4000)
        loop: true
    lights:
      front_lights: {effect: Bouncing Balls, colors: ["#ffffff", "#5000c0"], speed: 128, intensity: 100, transition: 1}   # bone-white balls bouncing over purple (measured 73%)
      floods: {colors: ["#ffffff", "#7a00ff"], animation: drift, period: 10}   # bones jiggling
      graveyard: "#ff0000"
      living_room: {colors: ["#ffffff", "#5000a0"], animation: drift, period: 1.5}                 # bone white and purple, bouncing
      front_bedroom: {color: "#e0e0ff", animation: pulse, period: 2, low: 0.6}
      porch: {colors: ["#ffffff", "#5000a0"], animation: drift, period: 3}
      lamp_post: {color: "#e0e0ff"}
    outputs: {fog_machine: {burst: 4, every: 35, first: 5}}   # fog: graveyard haze for the dancing dead

  - name: Seance
    master: 2
    players:
      1:
        file: "Ghostly Apparitions-Beckoning Beauty.mp4"
        level: 60   # old omxplayer vol: -15
        loop: true
      2:
        file: "WH - Spell3 - Seance - Hollusion-TV-Window/WH_Spell 3_Seance_Holl_H.mp4"
        level: 100  # old omxplayer vol: 0
    lights:
      front_lights: {effect: Aurora, palette: Set Colors, colors: ["#6a00ff", "#00c8a0"], speed: 60, intensity: 150, transition: 1}   # spirit glow
      floods: {colors: ["#6a00ff", "#00c8a0"], animation: drift, period: 12}   # spirits breathing
      graveyard: "#00ff00"
      living_room: {colors: ["#6a00ff", "#00c8a0"], animation: drift, period: 6}   # spirit glow
      front_bedroom: {color: "#ff7a20", effect: candle}   # seance candles
      porch: {color: "#00c8a0"}
      lamp_post: {color: "#ff7a20", effect: candle}
    outputs: {pond_mister: on, fog_machine: {burst: 5, every: 30}}   # fog: spirits rising

  - name: Guardians Inferno
    master: 1
    players:
      1:
        file: "Guardians_inferno.mp4"
        level: 100  # old omxplayer vol: 0
      2:
        file: "EE_OminousOculi_Swarm_Eyes+Mouths_H.mp4"
        level: 50   # eyes loop at 50% in every scene (was 100; old omxplayer vol 0)
        loop: true
    lights:
      front_lights: {effect: Pride 2015, speed: 128, intensity: 128, transition: 1}   # rainbow disco (measured 47%, brighter colours than Bpm)
      floods: {colors: ["#ff0000", "#ffaa00", "#00ff00", "#0060ff", "#c000ff"], animation: drift, period: 8}   # disco
      graveyard: "#ffff00"
      living_room: {colors: ["#ff0040", "#ffaa00", "#00ff80", "#0060ff", "#c000ff"], animation: drift, period: 1}   # disco
      front_bedroom: {colors: ["#c000ff", "#0060ff", "#00ff80", "#ffaa00", "#ff0040"], animation: drift, period: 1.2}
      porch: {colors: ["#ff0040", "#ffaa00", "#00ff80", "#0060ff", "#c000ff"], animation: drift, period: 2}
      lamp_post: {colors: ["#c000ff", "#0060ff", "#00ff80", "#ffaa00", "#ff0040"], animation: drift, period: 1.5}
    outputs: {fog_machine: {burst: 4, every: 30, first: 5}}   # fog: disco haze makes the lights show

  - name: Ghosts n Stuff
    master: 2
    players:
      1:
        file: "Jack-O-Lantern - Funny Faces - Window/Jack-O-Lantern - Funny Faces - Window/JOLJ_FunnyFaces_Trio_Win_BG_H.mp4"
        level: 100  # old omxplayer vol: 0
        loop: true
      2:
        file: "deadmou5_ghostsnstuff.mp4"
        level: 100  # old omxplayer vol: 0
    lights:
      front_lights: {effect: Colorwaves, palette: Color Gradient, colors: ["#00a0ff", "#ff00c0", "#0040ff"], speed: 160, intensity: 128, transition: 1}   # club blue and pink waves (measured 63%; Juggle was 2%)
      floods: {colors: ["#00ffff", "#ff00ff"], animation: drift, period: 8}   # Window half vs Wall half, swapping
      graveyard: "#ff0000"
      living_room: {colors: ["#00a0ff", "#ff00c0"], animation: pulse, period: 2, low: 0.6}   # EDM
      front_bedroom: {colors: ["#00ffff", "#ff00ff", "#0000ff"], animation: drift, period: 1}
      porch: {colors: ["#00a0ff", "#ff00c0"], animation: pulse, period: 2, low: 0.6}
      lamp_post: {colors: ["#00ffff", "#ff00ff"], animation: drift, period: 2}
    outputs: {fog_machine: {burst: 4, every: 30, first: 5}}   # fog: club haze


  - name: Stayin' Undead
    master: 1
    players:
      1:
        file: "Stayin-Undead-fast-cut-v2.mp4"
        level: 100
      2:
        file: "Stayin-Undead-scrim-loop-78s.mp4"
        level: 0    # muted; the window carries the song
        loop: true
        start_after: 5
    lights:
      front_lights: {effect: Glitter, palette: Party, speed: 128, intensity: 128, transition: 1}   # disco-ball sparkle
      floods: {colors: ["#ff00ff", "#00ffff", "#ffff00"], animation: drift, period: 8}   # disco colours
      graveyard: "#00ff00"
      living_room: {colors: ["#ff0040", "#ffaa00", "#00ff80", "#0060ff", "#c000ff"], effect: prism}   # disco ball (drift where a bulb has no prism)
      front_bedroom: {colors: ["#ffaa00", "#ff0040", "#c000ff", "#0060ff", "#00ff80"], animation: drift, period: 1.5}
      porch: {colors: ["#ff0040", "#ffaa00", "#00ff80", "#0060ff", "#c000ff"], animation: drift, period: 2}
      lamp_post: {colors: ["#0060ff", "#c000ff", "#ff0040", "#ffaa00", "#00ff80"], effect: prism}
    outputs: {fog_machine: {burst: 4, every: 30, first: 5}}   # fog: disco haze
