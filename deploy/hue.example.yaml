# /etc/haunt/hue.yaml, on the Pi that runs `haunt hue` (home-pi, next to the director).
#
#   python3 -m haunt hue -c /etc/haunt/hue.yaml --discover    find the bridge
#   python3 -m haunt hue -c /etc/haunt/hue.yaml --pair        press the bridge button first
#   python3 -m haunt hue -c /etc/haunt/hue.yaml --list        rooms, bulbs, which effects they have
#   python3 -m haunt hue -c /etc/haunt/hue.yaml --test living_room '{"color":"#ff6a00","effect":"candle"}'

mqtt:
  host: 192.168.1.244
  username: home-pi
  # password comes from HAUNT_MQTT_PASSWORD in /etc/haunt/env

bridge: 192.168.1.148        # or "auto" (mDNS / Philips discovery)
key_file: /etc/haunt/hue.key # written by --pair; never commit the key
rate: 10                     # light commands a second (Hue's guidance; lower if the bridge complains)

# show.yaml light name: what it is on the bridge (case, spaces and underscores don't matter).
#   a Hue room or zone:      living_room: Living room
#   bulbs by name:           porch: {lights: [Porch left, Porch right]}
#   floor: N                 optional: never dimmer than N % while the show runs
#                            (e.g. if a light is needed to see by); still off when the show stops
#   full: true               optional: always full brightness (the scene's bri and dark
#                            colours' darkness are ignored; pulses/flicker still dip)
# `--list` prints every room, zone and bulb name, and marks the ones in use.
rooms:
  living_room: {room: Living room, full: true}     # indoors: full brightness so it shows outside
  front_bedroom: {room: Main Bedroom, full: true}  # the front bedroom is "Main Bedroom" in the Hue app
  porch: {lights: [Porch 1, Porch 2]}     # the two porch lights (in the "Front yard" room)
  lamp_post: {lights: [Side Pole Light]}  # by the driveway
