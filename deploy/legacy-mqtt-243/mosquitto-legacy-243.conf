# /etc/mosquitto/conf.d/legacy-243.conf on home-pi (mode 640 root:mosquitto).
# Legacy MQTT devices that only know a broker at 192.168.1.243 (Home
# Assistant's old address): the graveyard Photon "halloweentree" (anonymous),
# the basement freezer monitor (logs in as home-pi) and an "outTopic" test
# device. This broker listens on that address only and bridges their topics
# to Home Assistant's broker (192.168.1.244), where the show and HA use them.
# home-pi gets 192.168.1.243 from mosquitto-dropin.conf.
per_listener_settings true
log_dest stdout                    # also into the journal, for `haunt devwatch`

listener 1883 192.168.1.243
allow_anonymous true
acl_file /etc/mosquitto/legacy-243.acl

connection ha-244
address 192.168.1.244:1883
remote_clientid home-pi-legacy-243
remote_username home-pi
remote_password CHANGE-ME          # the MQTT password from /etc/haunt/env
try_private false
cleansession true
topic graveyard/# both 0
topic ghosts/# both 0
topic basement_freezer/# both 0
topic outTopic/# both 0
