# /etc/systemd/system/mosquitto.service.d/legacy-243.conf on home-pi
# Give home-pi the old broker address 192.168.1.243 (next to its DHCP address) before mosquitto listens on it.
[Unit]
After=network-online.target
Wants=network-online.target
[Service]
ExecStartPre=+/sbin/ip addr replace 192.168.1.243/22 dev enxb827eb277441
