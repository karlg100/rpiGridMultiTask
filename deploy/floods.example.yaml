# /etc/haunt/floods.yaml, on the Pi that runs `haunt floods` (home-pi, next to the director).
#
#   python3 -m haunt floods -c /etc/haunt/floods.yaml --list          Home Assistant's lights
#   python3 -m haunt floods -c /etc/haunt/floods.yaml --list flood    ... only those matching "flood"
#   python3 -m haunt floods -c /etc/haunt/floods.yaml --walk          light 1, 2, 3 ... in turn: check the order
#   python3 -m haunt floods -c /etc/haunt/floods.yaml --test floods '{"color":"#ff6a00","animation":"chase"}'

mqtt:
  host: 192.168.1.244
  username: home-pi
  # password comes from HAUNT_MQTT_PASSWORD in /etc/haunt/env

home_assistant: http://192.168.1.244:8123
token_file: /etc/haunt/ha.token   # a long-lived access token (HA profile > Security); never commit it

rate: 5        # light commands a second (the AiDot hub manages ~5.2, one after another)
workers: 3     # light commands in flight at once (more only queues in the hub)
fps: 5         # animation frames a second; only lights that change are sent
idle: off      # when the show is not running: off | leave (hands off) | a setting, e.g. "#ff6a00"
max_bri: 255   # cap every light's brightness (1-255); lower it when the solar batteries are low
keepalive: 20   # re-send a lit flood this often (s): in motion mode they switch themselves off ~30 s after a command

# show.yaml light name: its Home Assistant lights, in order along the house.
# First = the Window (player 1) end, last = the Wall (player 2) end.
# This house: 14 lights, labelled 01-12, 14, 15 (there is no 13; the labels skip it).
# On the house, Window to Wall, they run 14, 15, 1, 2 ... 12 (walked by Karl 2026-10-31).
# A light that is missing or unavailable in HA is skipped and picked up when it comes back.
rows:
  floods:
    entities:
      - light.sl5c_solar_spotlight_14
      - light.sl5c_solar_spotlight_15
      - light.sl5c_solar_spotlight_01
      - light.sl5c_solar_spotlight_02
      - light.sl5c_solar_spotlight_03
      - light.sl5c_solar_spotlight_04
      - light.sl5c_solar_spotlight_05
      - light.sl5c_solar_spotlight_06
      - light.sl5c_solar_spotlight_07
      - light.sl5c_solar_spotlight_08
      - light.sl5c_solar_spotlight_09
      - light.sl5c_solar_spotlight_10
      - light.sl5c_solar_spotlight_11
      - light.sl5c_solar_spotlight_12
