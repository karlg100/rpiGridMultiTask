# One of these per player Pi, as /etc/haunt/player.yaml

id: 1                          # must match the id used in show.yaml

mqtt:
  host: 192.168.1.244
  username: home-pi
  # password comes from HAUNT_MQTT_PASSWORD in /etc/haunt/env

media_root: /home/pi/videos    # file names in show.yaml are relative to this

rotate: 0                      # 180 for the upside-down projector (was --orientation 180)
mirror: false                  # true = flip left-right for rear projection; the console (v) and phone
                               # page switch it per player while the show runs, and that is remembered

# Where the sound goes. `mpv --audio-device=help` lists the choices.
#   headphone jack on current Raspberry Pi OS:  alsa/plughw:CARD=Headphones,DEV=0
audio_device: auto

trim: 100                      # percent; evens out two players with different amps
mono: true                     # one-speaker PA (JBL Eon/Ion): every clip mixed to mono, the same
                               # on both jack channels; `c` in the console switches a player to
                               # stereo and back (remembered in ~/.cache/haunt/player-state.json)
normalize: true                # measure each file's loudness once and even them out
video_fade: true               # fade picture to/from black. Needs --vo=gpu (the default)

# Extra mpv options. These are what the Pi 4s run:
#   --profile=fast       mpv's default GPU scaler dropped ~15 frames/s on a Pi 4
#   --vo=gpu, --gpu-context=drm   with no display connected mpv otherwise falls
#                        back to a slow software window and never recovers
mpv_args: ["--profile=fast", "--vo=gpu", "--gpu-context=drm"]
